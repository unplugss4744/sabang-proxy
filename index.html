<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>📦 송장 스캔</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif;
    background: #0f1115; color: #e8eaed; padding: 12px; min-height: 100vh;
  }
  h1 { font-size: 18px; text-align: center; margin-bottom: 10px; font-weight: 600; }

  /* 카메라 */
  #scanArea { position: relative; width: 100%; max-width: 480px; margin: 0 auto; }
  #video {
    width: 100%; border-radius: 12px; background: #000;
    aspect-ratio: 4 / 3; object-fit: cover;
  }
  #scanFrame {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 80%; height: 28%; border: 3px solid #4ade80; border-radius: 8px;
    box-shadow: 0 0 0 9999px rgba(0,0,0,0.35); pointer-events: none;
  }
  #status {
    text-align: center; padding: 10px; margin: 10px 0; border-radius: 8px;
    font-size: 14px; background: #1c1f26; min-height: 40px;
  }
  .status-ok { color: #4ade80; }
  .status-err { color: #f87171; }
  .status-load { color: #60a5fa; }

  /* 버튼 */
  .btn {
    display: block; width: 100%; max-width: 480px; margin: 8px auto;
    padding: 14px; font-size: 16px; font-weight: 600; border: none;
    border-radius: 10px; cursor: pointer;
  }
  .btn-primary { background: #2563eb; color: #fff; }
  .btn-rescan  { background: #374151; color: #fff; }
  .btn-save    { background: #16a34a; color: #fff; }

  /* 결과 카드 */
  #results { max-width: 480px; margin: 12px auto; }
  .card {
    background: #1c1f26; border-radius: 12px; padding: 14px; margin-bottom: 12px;
    border: 1px solid #2a2e37;
  }
  .card-photo {
    width: 100%; height: 180px; object-fit: contain; background: #0f1115;
    border-radius: 8px; margin-bottom: 10px;
  }
  .card-photo-empty {
    width: 100%; height: 100px; display: flex; align-items: center; justify-content: center;
    background: #0f1115; border-radius: 8px; margin-bottom: 10px; color: #6b7280; font-size: 13px;
  }
  .card-name { font-size: 16px; font-weight: 600; margin-bottom: 6px; word-break: break-word; }
  .card-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; font-size: 14px; border-top: 1px solid #2a2e37; }
  .card-row .label { color: #9ca3af; }
  .qty-normal { color: #e8eaed; font-weight: 600; }
  .qty-multi  { color: #f87171; font-weight: 700; font-size: 17px; }
  .badge-warn { display: inline-block; background: #7c2d12; color: #fdba74; font-size: 11px; padding: 2px 8px; border-radius: 10px; margin-left: 6px; }
  .link-btn {
    display: inline-block; background: #1e40af; color: #fff; padding: 6px 12px;
    border-radius: 6px; text-decoration: none; font-size: 13px;
  }
  .link-empty { color: #6b7280; font-size: 13px; }

  /* 무게 입력 */
  .weight-box { margin-top: 12px; padding-top: 12px; border-top: 2px solid #2a2e37; }
  .weight-box h3 { font-size: 14px; margin-bottom: 8px; color: #cbd5e1; }
  .weight-row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
  .weight-row label { width: 70px; font-size: 13px; color: #9ca3af; }
  .weight-row input {
    flex: 1; padding: 10px; font-size: 16px; border: 1px solid #374151;
    border-radius: 6px; background: #0f1115; color: #e8eaed;
  }
  .dim-row { display: flex; gap: 6px; }
  .dim-row input { width: 100%; text-align: center; }
  .dim-x { display: flex; align-items: center; color: #6b7280; }
  .vol-preview { font-size: 13px; color: #60a5fa; margin: 4px 0 8px; min-height: 18px; }
  .invoice-tag { text-align: center; font-size: 13px; color: #9ca3af; margin-bottom: 8px; }
</style>
</head>
<body>
  <h1>📦 송장 스캔</h1>

  <div id="scanArea">
    <video id="video" playsinline></video>
    <div id="scanFrame"></div>
  </div>

  <div id="status" class="status-load">카메라 준비 중…</div>

  <button id="rescanBtn" class="btn btn-rescan" style="display:none;">🔄 다시 스캔</button>

  <div id="results"></div>

<script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>
<script>
  // ════════════════════════════════════════════
  // 설정 — SECRET_KEY 를 실제 값으로 교체하세요
  // ════════════════════════════════════════════
  var GAS_URL    = 'https://script.google.com/macros/s/AKfycbxudgtX5VbLnqqBG9uvO6Xg31jYZk1Ix7SSbxzBmHmc64UTuddn3CSltRD4-g_GsSHcdA/exec';
  var SECRET_KEY = '0426';   // ← Auth.gs 의 SECRET_KEY 값으로 교체

  var videoEl   = document.getElementById('video');
  var statusEl  = document.getElementById('status');
  var resultsEl = document.getElementById('results');
  var rescanBtn = document.getElementById('rescanBtn');

  var codeReader = new ZXing.BrowserMultiFormatReader();
  var scanning   = false;
  var lastCode   = '';

  function setStatus(msg, cls) {
    statusEl.textContent = msg;
    statusEl.className = cls || '';
  }

  // ── GAS 호출 (text/plain 으로 CORS preflight 회피) ──
  async function callGas(action, data) {
    var res = await fetch(GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ secretKey: SECRET_KEY, action: action, data: data }),
      redirect: 'follow'
    });
    return await res.json();
  }

  // ── 카메라 시작 + 연속 스캔 ──
  function startScan() {
    scanning = true;
    lastCode = '';
    resultsEl.innerHTML = '';
    rescanBtn.style.display = 'none';
    setStatus('송장 바코드를 초록 박스 안에 맞춰주세요', 'status-load');

    codeReader.decodeFromVideoDevice(null, 'video', function(result, err) {
      if (!scanning) return;
      if (result) {
        var code = result.getText();
        if (code && code !== lastCode) {
          lastCode = code;
          onScanned(code);
        }
      }
    }).catch(function(e) {
      setStatus('카메라 시작 실패: ' + e.message + ' (HTTPS·카메라 권한 확인)', 'status-err');
    });
  }

  function stopScan() {
    scanning = false;
    try { codeReader.reset(); } catch(e) {}
  }

  // ── 스캔 성공 처리 ──
  async function onScanned(code) {
    stopScan();
    if (navigator.vibrate) navigator.vibrate(120);
    setStatus('🔍 조회 중: ' + code, 'status-load');

    try {
      var r = await callGas('scanInvoice', { invoice: code });
      if (!r.success) {
        setStatus('❌ ' + (r.error || '조회 실패'), 'status-err');
        rescanBtn.style.display = 'block';
        return;
      }
      setStatus('✅ ' + r.count + '건 조회됨', 'status-ok');
      renderResults(r);
      rescanBtn.style.display = 'block';
    } catch(e) {
      setStatus('❌ 통신 오류: ' + e.message, 'status-err');
      rescanBtn.style.display = 'block';
    }
  }

  // ── 결과 렌더링 ──
  function renderResults(r) {
    resultsEl.innerHTML = '<div class="invoice-tag">송장: ' + r.invoice + ' (' + r.count + '건)</div>';

    r.items.forEach(function(item, idx) {
      var card = document.createElement('div');
      card.className = 'card';

      // 사진
      var photoHtml = item.photoUrl
        ? '<img class="card-photo" src="' + item.photoUrl + '" alt="" onerror="this.outerHTML=\'<div class=card-photo-empty>이미지 로드 실패</div>\'">'
        : '<div class="card-photo-empty">사진 없음</div>';

      // 상품명 + PD 미매칭 배지
      var nameHtml = '<div class="card-name">' + escapeHtml(item.productName)
        + (item.pdMatched ? '' : '<span class="badge-warn">⚠️ PD 미등록</span>') + '</div>';

      // 개수
      var qtyHtml = '<div class="card-row"><span class="label">개수</span>'
        + '<span class="' + (item.isMulti ? 'qty-multi' : 'qty-normal') + '">'
        + item.qty + '개' + (item.isMulti ? ' ⚠️' : '') + '</span></div>';

      // 구매처
      var purchaseHtml = '<div class="card-row"><span class="label">구매처</span>'
        + (item.purchaseUrl
            ? '<a class="link-btn" href="' + item.purchaseUrl + '" target="_blank">구매서 열기</a>'
            : '<span class="link-empty">정보 없음</span>')
        + '</div>';

      // 무게 입력 폼 (행마다 — key 로 저장)
      var weightHtml =
        '<div class="weight-box">'
        + '<h3>⚖️ 무게 입력 (선택)</h3>'
        + '<div class="weight-row"><label>실무게(kg)</label>'
        + '<input type="number" step="0.1" inputmode="decimal" id="rw_' + idx + '" value="' + (item.realWeight || '') + '" placeholder="예: 1.2"></div>'
        + '<div class="weight-row"><label>부피(cm)</label>'
        + '<div class="dim-row">'
        + '<input type="number" inputmode="numeric" id="w_' + idx + '" placeholder="가로" oninput="updateVol(' + idx + ')">'
        + '<span class="dim-x">×</span>'
        + '<input type="number" inputmode="numeric" id="h_' + idx + '" placeholder="세로" oninput="updateVol(' + idx + ')">'
        + '<span class="dim-x">×</span>'
        + '<input type="number" inputmode="numeric" id="d_' + idx + '" placeholder="높이" oninput="updateVol(' + idx + ')">'
        + '</div></div>'
        + '<div class="vol-preview" id="vol_' + idx + '">' + (item.volWeight ? '저장된 부피무게: ' + item.volWeight + 'kg' : '') + '</div>'
        + '<button class="btn btn-save" onclick="saveWeight(\'' + escapeAttr(item.key) + '\', ' + idx + ', this)">💾 저장</button>'
        + '</div>';

      card.innerHTML = photoHtml + nameHtml + qtyHtml + purchaseHtml + weightHtml;
      resultsEl.appendChild(card);
    });
  }

  // ── 부피무게 실시간 미리보기 ──
  window.updateVol = function(idx) {
    var w = parseFloat(document.getElementById('w_' + idx).value) || 0;
    var h = parseFloat(document.getElementById('h_' + idx).value) || 0;
    var d = parseFloat(document.getElementById('d_' + idx).value) || 0;
    var el = document.getElementById('vol_' + idx);
    if (w > 0 && h > 0 && d > 0) {
      var vol = Math.ceil((w * h * d) / 6000);
      el.textContent = '계산 부피무게: ' + vol + 'kg  (' + w + '×' + h + '×' + d + ' ÷ 6000 올림)';
    } else {
      el.textContent = '';
    }
  };

  // ── 무게 저장 ──
  window.saveWeight = async function(key, idx, btn) {
    var rw = document.getElementById('rw_' + idx).value;
    var w  = document.getElementById('w_' + idx).value;
    var h  = document.getElementById('h_' + idx).value;
    var d  = document.getElementById('d_' + idx).value;

    btn.disabled = true;
    btn.textContent = '저장 중…';

    try {
      var r = await callGas('saveWeight', { key: key, realWeight: rw, w: w, h: h, d: d });
      if (r.success) {
        var parts = [];
        if (r.saved.realWeight != null) parts.push('실무게 ' + r.saved.realWeight + 'kg');
        if (r.saved.volWeight  != null) parts.push('부피무게 ' + r.saved.volWeight + 'kg');
        btn.textContent = '✅ 저장됨 (' + (parts.join(' / ') || '변경 없음') + ')';
        btn.style.background = '#15803d';
      } else {
        btn.textContent = '❌ ' + (r.error || '실패');
        btn.style.background = '#b91c1c';
        btn.disabled = false;
      }
    } catch(e) {
      btn.textContent = '❌ 통신 오류';
      btn.style.background = '#b91c1c';
      btn.disabled = false;
    }
  };

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function(c) {
      return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
    });
  }
  function escapeAttr(s) { return String(s).replace(/'/g, "\\'"); }

  rescanBtn.onclick = startScan;

  // 시작
  startScan();
</script>
</body>
</html>
