<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>배송 조회 · Order Tracking</title>
<style>
  :root{--bg:#f7f6f3;--card:#fff;--txt:#1c1c1a;--sub:#6b6a64;--line:#e4e2da;--accent:#1a1a18;--accent2:#3b6d55}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
       background:var(--bg);color:var(--txt);line-height:1.6;-webkit-font-smoothing:antialiased}
  .wrap{max-width:560px;margin:0 auto;padding:48px 20px 80px}
  h1{font-size:22px;font-weight:600;margin:0 0 6px}
  .lead{color:var(--sub);font-size:14px;margin:0 0 28px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px}
  label{display:block;font-size:13px;color:var(--sub);margin:14px 0 6px}
  label:first-child{margin-top:0}
  select,input{width:100%;height:44px;padding:0 14px;border:1px solid var(--line);border-radius:10px;
       font-size:15px;background:#fff;color:var(--txt);outline:none}
  select:focus,input:focus{border-color:var(--accent2)}
  button{width:100%;height:48px;margin-top:20px;border:0;border-radius:10px;background:var(--accent);color:#fff;
       font-size:15px;font-weight:600;cursor:pointer}
  button:disabled{opacity:.5;cursor:default}
  .msg{margin-top:16px;font-size:14px;color:#a3302d;display:none}
  .result{margin-top:24px;display:none}
  .rrow{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line);font-size:14px}
  .rrow .k{color:var(--sub)}
  .rrow .v{text-align:right;font-weight:500;max-width:340px}
  .badge{display:inline-block;padding:4px 12px;border-radius:20px;font-size:13px;font-weight:600;
       background:#eaf3ee;color:#1f5c43}
  .badge.gray{background:#efeee8;color:#5f5e5a}
  .badge.red{background:#fbeaea;color:#a3302d}
  .track-btn{display:inline-block;margin-top:4px;padding:8px 16px;border:1px solid var(--line);border-radius:8px;
       font-size:13px;color:var(--txt);text-decoration:none;background:#fff}
  .items{font-size:13px;color:var(--sub);margin:4px 0 0;padding-left:16px}
  .foot{text-align:center;color:var(--sub);font-size:12px;margin-top:32px}
  .spin{display:inline-block;width:16px;height:16px;border:2px solid #fff;border-top-color:transparent;
       border-radius:50%;animation:sp .7s linear infinite;vertical-align:-3px}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">
  <h1>배송 조회</h1>
  <p class="lead">주문 시 입력하신 이메일과 주문번호로 배송 상태를 확인하세요.<br>Enter your email and order number to track your shipment.</p>
  <div class="card">
    <label for="store">스토어 · Store</label>
    <select id="store">
      <option value="flyeuro">FLY EURO (flyeuro.com)</option>
      <option value="apoeuro">APO EURO (apoeuro.com)</option>
      <option value="myapo">MYAPO (myapo.co.kr)</option>
    </select>
    <label for="email">이메일 · Email</label>
    <input id="email" type="email" placeholder="name@example.com" autocomplete="email">
    <label for="onum">주문번호 · Order number</label>
    <input id="onum" type="text" placeholder="1024" inputmode="numeric">
    <button id="go">조회하기 · Track</button>
    <div class="msg" id="msg"></div>
    <div class="result" id="result"></div>
  </div>
  <p class="foot">문의 · Support: help@example.com</p>
</div>
<script>
  var API="https://dales-london.netlify.app/.netlify/functions/shopify-proxy";
  var btn=document.getElementById("go"),msg=document.getElementById("msg"),res=document.getElementById("result");
  function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
  function show(err){msg.style.display="block";msg.textContent=err;res.style.display="none"}
  function fmtDate(iso){try{var d=new Date(iso);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}catch(e){return""}}
  function badgeClass(s){if(/취소|환불/.test(s))return"red";if(/준비|접수/.test(s))return"gray";return""}
  async function track(){
    msg.style.display="none";res.style.display="none";
    var store=document.getElementById("store").value;
    var email=document.getElementById("email").value.trim();
    var onum=document.getElementById("onum").value.trim();
    if(!email||!onum){show("이메일과 주문번호를 모두 입력해 주세요. Please enter both email and order number.");return}
    btn.disabled=true;btn.innerHTML='<span class="spin"></span>';
    try{
      var r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({store:store,action:"track_order",params:{email:email,order_number:onum}})});
      var j=await r.json();
      if(!j.success){show(j.error||"조회에 실패했습니다. Lookup failed.");return}
      var o=j.order,html="";
      html+='<div class="rrow"><span class="k">주문번호 · Order</span><span class="v">'+esc(o.name)+'</span></div>';
      html+='<div class="rrow"><span class="k">주문일 · Date</span><span class="v">'+esc(fmtDate(o.created_at))+'</span></div>';
      html+='<div class="rrow"><span class="k">상태 · Status</span><span class="v"><span class="badge '+badgeClass(o.status)+'">'+esc(o.status)+'</span></span></div>';
      if(o.items&&o.items.length){
        html+='<div class="rrow"><span class="k">상품 · Items</span><span class="v">'+esc(o.items[0])+
          (o.items.length>1?'<ul class="items">'+o.items.slice(1).map(function(i){return"<li>"+esc(i)+"</li>"}).join("")+'</ul>':'')+'</span></div>';
      }
      if(o.tracks&&o.tracks.length){
        o.tracks.forEach(function(t){
          html+='<div class="rrow"><span class="k">운송장 · Tracking</span><span class="v">'+esc(t.number)+
            (t.company?' <span style="color:var(--sub)">('+esc(t.company)+')</span>':'')+
            (t.url?'<br><a class="track-btn" href="'+esc(t.url)+'" target="_blank" rel="noopener">배송추적 열기 · Track ↗</a>':'')+'</span></div>';
        });
      }else if(/배송|출고/.test(o.status)){
        html+='<div class="rrow"><span class="k">운송장 · Tracking</span><span class="v" style="color:var(--sub)">등록 대기 중 · Pending</span></div>';
      }
      res.innerHTML=html;res.style.display="block";
    }catch(e){show("네트워크 오류가 발생했습니다. Network error, please try again.")}
    finally{btn.disabled=false;btn.textContent="조회하기 · Track"}
  }
  btn.addEventListener("click",track);
  document.getElementById("onum").addEventListener("keydown",function(e){if(e.key==="Enter")track()});
</script>
</body>
</html>
